[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wiki-translator-suite"
version = "1.0.0"
description = "Semi-automatic Grade A++ Wikipedia translation and publishing suite (en.wikipedia -> id.wikipedia)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Wiki Translator Suite Team" }
]
keywords = [
    "wikipedia",
    "translation",
    "llm",
    "wikitext",
    "indonesian",
    "mediawiki",
    "gemini"
]
dependencies = [
    "requests>=2.28.0",
    "rich>=13.0.0",
    "mwparserfromhell>=0.7,<0.8",
    "tenacity>=8.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "ruff>=0.3.0",
    "mypy>=1.8.0",
]

[project.scripts]
wiki-translator = "wiki_translator.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["wiki_translator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]
